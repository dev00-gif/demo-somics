# ==============================================================================
# MQTT Station — FULL STACK (EMQX broker + app Next.js) chạy 1 lệnh:
#
#   nano .env                        # điền secrets (template có sẵn ở root)
#   docker compose up -d --build    # build + chạy cả 2 service
#
# Dùng cho: VPS gộp cả broker + app, demo, staging.
# Production với Dokploy: khuyến nghị deploy 2 service riêng
# (EMQX = Docker Compose service, App = Application service — xem
# deploy/app/README.md) để redeploy app không restart broker.
#
# Chi tiết cấu hình EMQX: deploy/emqx/docker-compose.yml + deploy/emqx/README.md
# ==============================================================================

services:
  # ──────────────────────────────────────────────────────────────────────────────
  # EMQX MQTT Broker
  # ──────────────────────────────────────────────────────────────────────────────
  emqx:
    image: emqx/emqx:${EMQX_VERSION:-6.1.5}
    # KHÔNG đặt container_name: Dokploy quản lý tên container theo project
    # (vd <project>-emqx-1) — đặt cứng sẽ conflict khi deploy lại.
    # Xem tên thật: docker ps | grep emqx
    hostname: ${EMQX_NODE_HOST:-node1.emqx.local}
    environment:
      EMQX_NODE_NAME: emqx@${EMQX_NODE_HOST:-node1.emqx.local}
      # Cookie Erlang: KHÔNG đặt env = dùng default (chỉ dev/test).
      # Production: đặt EMQX_NODE_COOKIE trong tab Environment của Dokploy.
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:-insecure-default-cookie-CHANGE-ME}
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${DASHBOARD_USERNAME:-admin}
      # KHÔNG đặt = fallback admin/public, EMQX buộc đổi mật khẩu ở lần login đầu.
      # Dashboard bind 127.0.0.1 nên rủi ro thấp, nhưng production nên đặt env này.
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${DASHBOARD_PASSWORD:-}
      # Tắt anonymous: khai báo authenticator built-in database + bootstrap user
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM: '{"name":"sha256","salt_position":"suffix"}'
      EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE: /opt/emqx/etc/auth-bootstrap.csv
      EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE: plain
      EMQX_LOG__CONSOLE_HANDLER__ENABLE: "true"
      EMQX_LOG__CONSOLE_HANDLER__LEVEL: ${EMQX_LOG_LEVEL:-warning}

      # ----- Listener WebSocket (port 8083) --------------------------------------
      # MQTTX Web chạy trong browser → chỉ nối được broker qua ws:// (WebSocket),
      # không nối trực tiếp TCP 1883 được. Listener này phục vụ web client.
      EMQX_LISTENERS__WS__DEFAULT__BIND: "0.0.0.0:8083"

      # ===== MQTT TLS (8883) — TẮT MẶC ĐỊNH =====================================
      # Muốn bật: (1) chạy cd deploy/emqx/certs && ./gen-certs.sh <domain/IP>,
      # (2) commit ca.crt/server.crt/server.key vào repo (hoặc đưa lên VPS bằng tay),
      # (3) uncomment các dòng SSL bên dưới + port 8883 + 3 dòng mount cert.
      # Hướng dẫn đầy đủ: deploy/emqx/README.md mục 8.
      # EMQX_LISTENERS__SSL__DEFAULT__BIND: "0.0.0.0:8883"
      # EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: /opt/emqx/etc/certs/ca.crt
      # EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/etc/certs/server.crt
      # EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/etc/certs/server.key
      # EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: verify_none
      # EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT: "false"
    ports:
      - "${MQTT_TCP_BIND:-0.0.0.0}:1883:1883"      # MQTT TCP (nội mạng tin cậy)
      - "${MQTT_WS_BIND:-0.0.0.0}:8083:8083"       # MQTT WebSocket — cho MQTTX Web client
      # - "${MQTT_TLS_BIND:-0.0.0.0}:8883:8883"    # bật khi có chứng chỉ TLS
      - "${DASHBOARD_BIND:-127.0.0.1}:18083:18083" # Dashboard — chỉ localhost mặc định
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - ./deploy/emqx/emqx/auth-bootstrap.csv:/opt/emqx/etc/auth-bootstrap.csv:ro
      # Chứng chỉ TLS — uncomment cùng khối SSL phía trên khi đã tạo cert:
      # - ./deploy/emqx/certs/ca.crt:/opt/emqx/etc/certs/ca.crt:ro
      # - ./deploy/emqx/certs/server.crt:/opt/emqx/etc/certs/server.crt:ro
      # - ./deploy/emqx/certs/server.key:/opt/emqx/etc/certs/server.key:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${EMQX_MEM_LIMIT:-1g}
    networks:
      - mqtt-net

  # ──────────────────────────────────────────────────────────────────────────────
  # App Next.js (FE uploader + BE API routes) — build từ Dockerfile root
  # ──────────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mqtt-station:latest
    depends_on:
      emqx:
        condition: service_healthy   # chờ broker healthy mới start app
    environment:
      NODE_ENV: production
      # App gọi broker qua mạng nội bộ Docker — KHÔNG đi ra internet
      MQTT_URL: mqtt://emqx:1883
      # App đăng nhập broker — PHẢI khớp user trong deploy/emqx/emqx/auth-bootstrap.csv.
      # Default dưới đây khớp placeholder trong CSV; đổi cả 2 nơi khi lên production.
      MQTT_USERNAME: ${MQTT_APP_USERNAME:-web-backend}
      MQTT_PASSWORD: ${MQTT_APP_PASSWORD:-change_me_backend_password}
      MQTT_CLIENT_ID_PREFIX: ${MQTT_CLIENT_ID_PREFIX:-web-uploader}
      MQTT_TOPIC_BASE: ${MQTT_TOPIC_BASE:-station/player}
    # KHÔNG publish port app ra host khi chạy trên Dokploy — port 3000 đã bị
    # Dashboard Dokploy chiếm. Truy cập app qua Dokploy → Domains (Traefik →
    # container qua dokploy-network). Chạy compose ngoài Dokploy thì thêm lại:
    #   ports:
    #     - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-512m}
    networks:
      - mqtt-net
      # Traefik của Dokploy chạy trên dokploy-network — app phải join mạng này
      # thì Domain trong Dokploy UI mới route được vào container.
      # Trong Dokploy UI → Domains: port = 3000, service = app.
      - dokploy-network

  # ──────────────────────────────────────────────────────────────────────────────
  # MQTTX Web — giao diện MQTT client chạy trên browser (của EMQX, mã nguồn mở).
  # Bên nhúng/QA mở web này → nhập host/port/user → connect, subscribe, publish.
  # ⚠️ Browser chỉ nối broker qua ws:// (port 8083) — không phải TCP 1883.
  # ──────────────────────────────────────────────────────────────────────────────
  mqttx-web:
    image: emqx/mqttx-web:latest
    depends_on:
      - emqx
    restart: unless-stopped
    networks:
      - mqtt-net
      - dokploy-network   # để gắn domain qua Dokploy → Traefik route vào

# ==============================================================================
# NETWORK
# - mqtt-net        : mạng nội bộ cho app ↔ emqx nói chuyện (alias "emqx")
# - dokploy-network : mạng Traefik của Dokploy (external) — bắt buộc để gắn
#                     domain cho app. Nếu KHÔNG dùng Dokploy: xóa network này
#                     ở service app và khai báo dưới đây, rồi mở lại ports.
# ==============================================================================
networks:
  mqtt-net:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  emqx_data:
  emqx_log:
