# ==============================================================================
# MQTT Station — FULL STACK (EMQX broker + app Next.js) chạy 1 lệnh:
#
#   nano .env                        # điền secrets (template có sẵn ở root)
#   docker compose up -d --build    # build + chạy cả 2 service
#
# Dùng cho: VPS gộp cả broker + app, demo, staging.
# Production với Dokploy: khuyến nghị deploy 2 service riêng
# (EMQX = Docker Compose service, App = Application service — xem
# deploy/app/README.md) để redeploy app không restart broker.
#
# Chi tiết cấu hình EMQX: deploy/emqx/docker-compose.yml + deploy/emqx/README.md
# ==============================================================================

services:
  # ──────────────────────────────────────────────────────────────────────────────
  # EMQX MQTT Broker
  # ──────────────────────────────────────────────────────────────────────────────
  emqx:
    image: emqx/emqx:${EMQX_VERSION:-6.1.5}
    container_name: emqx
    hostname: ${EMQX_NODE_HOST:-node1.emqx.local}
    environment:
      EMQX_NODE_NAME: emqx@${EMQX_NODE_HOST:-node1.emqx.local}
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?Set EMQX_NODE_COOKIE (.env hoặc tab Environment trên Dokploy)}
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD (.env hoặc tab Environment trên Dokploy)}
      # Tắt anonymous: khai báo authenticator built-in database + bootstrap user
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM: '{"name":"sha256","salt_position":"suffix"}'
      EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE: /opt/emqx/etc/auth-bootstrap.csv
      EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE: plain
      EMQX_LOG__CONSOLE_HANDLER__ENABLE: "true"
      EMQX_LOG__CONSOLE_HANDLER__LEVEL: ${EMQX_LOG_LEVEL:-warning}

      # ----- Listener MQTT TLS (port 8883) --------------------------------------
      # Trỏ tới chứng chỉ do deploy/emqx/certs/gen-certs.sh tạo (mount bên dưới).
      # Thiết bị nhúng copy ca.crt về máy để verify server khi kết nối mqtts://.
      EMQX_LISTENERS__SSL__DEFAULT__BIND: "0.0.0.0:8883"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: /opt/emqx/etc/certs/ca.crt
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/etc/certs/server.crt
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/etc/certs/server.key
      # One-way TLS: client xác thực bằng username/password (built-in database).
      # Đổi verify_peer + fail_if_no_peer_cert=true nếu muốn mTLS.
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: verify_none
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT: "false"
    ports:
      - "${MQTT_TCP_BIND:-0.0.0.0}:1883:1883"      # MQTT TCP (nội mạng tin cậy)
      - "${MQTT_TLS_BIND:-0.0.0.0}:8883:8883"      # MQTT TLS — dùng cho thiết bị bên ngoài
      - "${DASHBOARD_BIND:-127.0.0.1}:18083:18083" # Dashboard — chỉ localhost mặc định
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - ./deploy/emqx/emqx/auth-bootstrap.csv:/opt/emqx/etc/auth-bootstrap.csv:ro
      # Chứng chỉ TLS (chỉ đọc) — tạo bằng:
      #   cd deploy/emqx/certs && ./gen-certs.sh <domain-hoặc-IP-VPS>
      - ./deploy/emqx/certs/ca.crt:/opt/emqx/etc/certs/ca.crt:ro
      - ./deploy/emqx/certs/server.crt:/opt/emqx/etc/certs/server.crt:ro
      - ./deploy/emqx/certs/server.key:/opt/emqx/etc/certs/server.key:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${EMQX_MEM_LIMIT:-1g}
    networks:
      - mqtt-net

  # ──────────────────────────────────────────────────────────────────────────────
  # App Next.js (FE uploader + BE API routes) — build từ Dockerfile root
  # ──────────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mqtt-station:latest
    container_name: mqtt-station
    depends_on:
      emqx:
        condition: service_healthy   # chờ broker healthy mới start app
    environment:
      NODE_ENV: production
      # App gọi broker qua mạng nội bộ Docker — KHÔNG đi ra internet
      MQTT_URL: mqtt://emqx:1883
      MQTT_USERNAME: ${MQTT_APP_USERNAME:?Set MQTT_APP_USERNAME (.env hoặc tab Environment trên Dokploy)}
      MQTT_PASSWORD: ${MQTT_APP_PASSWORD:?Set MQTT_APP_PASSWORD (.env hoặc tab Environment trên Dokploy)}
      MQTT_CLIENT_ID_PREFIX: ${MQTT_CLIENT_ID_PREFIX:-web-uploader}
      MQTT_TOPIC_BASE: ${MQTT_TOPIC_BASE:-station/player}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-512m}
    networks:
      - mqtt-net

# ==============================================================================
# NETWORK — mạng bridge riêng cho stack. Thiết bị nhúng bên ngoài kết nối MQTT
# qua port 1883 đã publish lên host. App↔Broker nói chuyện nội bộ qua alias "emqx".
# (Khác với compose của EMQX đơn lẻ dùng dokploy-network external — file này
# đứng độc lập, không phụ thuộc Dokploy.)
# ==============================================================================
networks:
  mqtt-net:
    driver: bridge

volumes:
  emqx_data:
  emqx_log:
