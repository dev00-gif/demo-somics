name: Deploy MQTT Station — Full Stack (Dokploy)

# Gộp 1 workflow duy nhất: deploy bằng 1 service Docker Compose trên Dokploy
# (EMQX + app trong cùng docker-compose.yml ở root) → chỉ cần gọi compose.deploy.
#
# Trigger: mọi push lên main (cả code app lẫn cấu hình broker cùng đi vào 1 lần
# deploy). Nếu muốn chỉ deploy khi có thay đổi thật sự, uncomment `paths:` bên dưới.
on:
  push:
    branches: [main]
    # paths:
    #   - "src/**"
    #   - "public/**"
    #   - "Dockerfile"
    #   - ".dockerignore"
    #   - "next.config.ts"
    #   - "package.json"
    #   - "package-lock.json"
    #   - "docker-compose.yml"
    #   - "deploy/**"
    #   - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-fullstack
  cancel-in-progress: false

env:
  DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
  DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
  HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}

jobs:
  deploy:
    name: Trigger Dokploy compose redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout (lấy SHA để ghi summary)
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------------
      # 1. Kiểm tra secrets — fail sớm với hướng dẫn rõ ràng.
      #    GitHub Actions không cho index động secrets[s] → map qua env + ${!s}.
      # ---------------------------------------------------------------------------
      - name: Validate secrets
        run: |
          missing=0
          for s in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_COMPOSE_ID; do
            if [ -z "${!s}" ]; then
              echo "::error::Secret '$s' chưa được cấu hình."
              echo "        GitHub → Settings → Secrets and variables → Actions → New repository secret"
              missing=1
            fi
          done
          exit $missing

      # ---------------------------------------------------------------------------
      # 2. Trigger deploy: POST /api/compose.deploy
      #    (service Docker Compose trên Dokploy — KHÔNG phải application.deploy)
      # ---------------------------------------------------------------------------
      - name: Gọi Dokploy API — compose.deploy
        run: |
          set -euo pipefail

          DEPLOYMENT_TITLE="GitHub ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "DEPLOYMENT_TITLE=$DEPLOYMENT_TITLE" >> "$GITHUB_ENV"
          PAYLOAD=$(jq -nc --arg id "$DOKPLOY_COMPOSE_ID" --arg title "$DEPLOYMENT_TITLE" \
            '{composeId: $id, title: $title}')

          HTTP_CODE=$(curl -sS -o /tmp/dokploy_response.json -w "%{http_code}" \
            --max-time 30 \
            -X POST \
            "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "HTTP $HTTP_CODE"
          echo "Response: $(cat /tmp/dokploy_response.json)"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Dokploy từ chối deploy (HTTP $HTTP_CODE)."
            echo "Gợi ý: DOKPLOY_URL không có / cuối · API key còn hạn ·"
            echo "DOKPLOY_COMPOSE_ID đúng là ID của service Docker Compose (không phải applicationId)."
            exit 1
          fi


      # ---------------------------------------------------------------------------
      # 3. Read the deployment history and match this run's unique title.
      # ---------------------------------------------------------------------------
      - name: Chờ đúng deployment hoàn tất
        timeout-minutes: 16
        run: |
          set -euo pipefail
          DEADLINE=$((SECONDS + 900))
          DEPLOYMENT_ID=""
          MISSING_COUNT=0
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            HTTP_CODE=$(curl -sS --max-time 15 --get \
              "${DOKPLOY_URL%/}/api/deployment.allByCompose" \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              --data-urlencode "composeId=$DOKPLOY_COMPOSE_ID" \
              -o /tmp/dokploy_deployments.json -w "%{http_code}") || HTTP_CODE=000

            case "$HTTP_CODE" in
              200)
                # Pin the immutable ID once; the title may change during deployment.
                if ! jq -e 'type == "array"' /tmp/dokploy_deployments.json > /dev/null; then
                  echo "::error::API deployment trả dữ liệu không đúng định dạng."
                  exit 1
                fi
                if [ -z "$DEPLOYMENT_ID" ]; then
                  if ! DEPLOYMENT_ID=$(jq -r --arg title "$DEPLOYMENT_TITLE" '
                    [ .[] | select(.title == $title) ] | sort_by(.createdAt) |
                    if length == 0 then "" else
                      .[-1].deploymentId |
                      if type == "string" and length > 0 then . else error("Missing deploymentId") end
                    end' /tmp/dokploy_deployments.json); then
                    echo "::error::Deployment không có ID hợp lệ."
                    exit 1
                  fi
                  if [ -n "$DEPLOYMENT_ID" ]; then
                    echo "Theo dõi deploymentId=$DEPLOYMENT_ID"
                  fi
                fi
                if [ -z "$DEPLOYMENT_ID" ]; then
                  STATUS=waiting_for_record
                elif ! STATUS=$(jq -er --arg id "$DEPLOYMENT_ID" '
                  [ .[] | select(.deploymentId == $id) ] |
                  if length == 0 then "missing" else .[0].status end
                  ' /tmp/dokploy_deployments.json); then
                  echo "::error::Không đọc được trạng thái deployment."
                  exit 1
                fi
                if [ "$STATUS" = "missing" ]; then
                  MISSING_COUNT=$((MISSING_COUNT + 1))
                  if [ "$MISSING_COUNT" -ge 3 ]; then
                    echo "::error::Deployment $DEPLOYMENT_ID đã từng xuất hiện nhưng mất khỏi 3 phản hồi API liên tiếp. Kiểm tra Deployments trong Dokploy; không thể xác nhận deploy thành công."
                    exit 1
                  fi
                else
                  MISSING_COUNT=0
                fi
                echo "Deployment của run này: $STATUS"
                case "$STATUS" in
                  done) echo "Deployment hoàn tất."; exit 0 ;;
                  error|cancelled|canceled)
                    echo "::error::Deployment $STATUS — xem Deployments → Logs trong Dokploy."
                    exit 1 ;;
                  waiting_for_record|running|missing) ;;
                  *) echo "::error::Trạng thái deployment không được hỗ trợ."; exit 1 ;;
                esac ;;
              000|429|5??) echo "API tạm thời không khả dụng (HTTP $HTTP_CODE), thử lại." ;;
              *)
                echo "::error::API deployment.allByCompose trả HTTP $HTTP_CODE. Kiểm tra URL, Compose ID, quyền API key và phiên bản Dokploy."
                exit 1 ;;
            esac
            REMAINING=$((DEADLINE - SECONDS))
            if [ "$REMAINING" -gt 0 ]; then
              DELAY=10
              if [ "$REMAINING" -lt "$DELAY" ]; then DELAY=$REMAINING; fi
              sleep "$DELAY"
            fi
          done
          echo "::error::Hết 15 phút chờ deployment; chưa xác nhận thành công. Xem log Dokploy."
          exit 1

      # ---------------------------------------------------------------------------
      # 4. Health check app qua domain public (tùy chọn — đặt secret HEALTH_CHECK_URL,
      #    vd https://mqtt-station.yourdomain.com/api/health; không đặt thì skip).
      # ---------------------------------------------------------------------------
      - name: Health check app sau deploy
        if: ${{ env.HEALTH_CHECK_URL != '' }}
        run: |
          set -euo pipefail
          URL="$HEALTH_CHECK_URL"

          # Compose restart làm app khởi động lại — chờ thêm chút trước khi poll
          sleep 30

          for i in $(seq 1 15); do
            HTTP_CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            BODY=$(cat /tmp/health.json 2>/dev/null || echo "")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health OK sau lần thử $i: $BODY"
              exit 0
            fi
            echo "[thử $i/15] HTTP $HTTP_CODE — chờ 10s..."
            sleep 10
          done

          echo "::error::App chưa healthy sau deploy ($URL)."
          echo "Kiểm tra: log build trong Dokploy · biến Environment · container emqx/app có chạy không."
          exit 1

      # ---------------------------------------------------------------------------
      # 5. Summary
      # ---------------------------------------------------------------------------
      - name: Tóm tắt
        if: always()
        run: |
          {
            echo "### 🚀 Deploy MQTT Station (full stack)"
            echo ""
            echo "| Mục | Giá trị |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Kết quả | ${{ job.status }} |"
            echo ""
            echo "_Lưu ý: deploy này restart cả EMQX — thiết bị nhúng sẽ tự reconnect trong ~30s._"
            echo ""
            echo "_Log chi tiết: Dokploy UI → service compose → Deployments._"
          } >> "$GITHUB_STEP_SUMMARY"
