name: Deploy MQTT Station — Full Stack (Dokploy)

# Gộp 1 workflow duy nhất: deploy bằng 1 service Docker Compose trên Dokploy
# (EMQX + app trong cùng docker-compose.yml ở root) → chỉ cần gọi compose.deploy.
#
# Trigger: mọi push lên main (cả code app lẫn cấu hình broker cùng đi vào 1 lần
# deploy). Nếu muốn chỉ deploy khi có thay đổi thật sự, uncomment `paths:` bên dưới.
on:
  push:
    branches: [main]
    # paths:
    #   - "src/**"
    #   - "public/**"
    #   - "Dockerfile"
    #   - ".dockerignore"
    #   - "next.config.ts"
    #   - "package.json"
    #   - "package-lock.json"
    #   - "docker-compose.yml"
    #   - "deploy/**"
    #   - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-fullstack
  cancel-in-progress: false

env:
  DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
  DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
  HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}

jobs:
  deploy:
    name: Trigger Dokploy compose redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (lấy SHA để ghi summary)
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------------
      # 1. Kiểm tra secrets — fail sớm với hướng dẫn rõ ràng.
      #    GitHub Actions không cho index động secrets[s] → map qua env + ${!s}.
      # ---------------------------------------------------------------------------
      - name: Validate secrets
        run: |
          missing=0
          for s in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_COMPOSE_ID; do
            if [ -z "${!s}" ]; then
              echo "::error::Secret '$s' chưa được cấu hình."
              echo "        GitHub → Settings → Secrets and variables → Actions → New repository secret"
              missing=1
            fi
          done
          exit $missing

      # ---------------------------------------------------------------------------
      # 2. Trigger deploy: POST /api/compose.deploy
      #    (service Docker Compose trên Dokploy — KHÔNG phải application.deploy)
      # ---------------------------------------------------------------------------
      - name: Gọi Dokploy API — compose.deploy
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl -sS -o /tmp/dokploy_response.json -w "%{http_code}" \
            --max-time 30 \
            -X POST \
            "$DOKPLOY_URL/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}")

          echo "HTTP $HTTP_CODE"
          echo "Response: $(cat /tmp/dokploy_response.json)"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Dokploy từ chối deploy (HTTP $HTTP_CODE)."
            echo "Gợi ý: DOKPLOY_URL không có / cuối · API key còn hạn ·"
            echo "DOKPLOY_COMPOSE_ID đúng là ID của service Docker Compose (không phải applicationId)."
            exit 1
          fi

      # ---------------------------------------------------------------------------
      # 3. Poll trạng thái (best-effort) — API là async, trigger OK ≠ deploy xong.
      #    Lưu ý: restart compose sẽ restart cả EMQX → thiết bị nhúng reconnect
      #    sau ~5-30s. Nên deploy trong khung giờ ít người dùng.
      # ---------------------------------------------------------------------------
      - name: Chờ deployment hoàn tất (best-effort polling)
        run: |
          set -uo pipefail

          MAX_ATTEMPTS=30   # 30 x 20s = tối đa 10 phút
          INTERVAL=20

          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -sS --max-time 15 \
              "$DOKPLOY_URL/api/compose.readStatus" \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}" \
              2>/dev/null || echo "")

            echo "[attempt $i/$MAX_ATTEMPTS] status: ${STATUS:-<không đọc được>}"

            case "$STATUS" in
              *error*)
                echo "::error::Deployment trên Dokploy báo lỗi — xem log trong Dokploy UI."
                exit 1
                ;;
              *done*|*idle*)
                echo "Deployment hoàn tất sau $((i * INTERVAL))s."
                exit 0
                ;;
            esac

            sleep $INTERVAL
          done

          echo "::warning::Hết 10 phút polling chưa đọc được trạng thái 'done'."
          echo "Deploy có thể vẫn đang chạy — kiểm tra Dokploy UI → Deployments."
          # Không fail: health check bên dưới mới là kết quả cuối.

      # ---------------------------------------------------------------------------
      # 4. Health check app qua domain public (tùy chọn — đặt secret HEALTH_CHECK_URL,
      #    vd https://mqtt-station.yourdomain.com/api/health; không đặt thì skip).
      # ---------------------------------------------------------------------------
      - name: Health check app sau deploy
        if: ${{ env.HEALTH_CHECK_URL != '' }}
        run: |
          set -euo pipefail
          URL="$HEALTH_CHECK_URL"

          # Compose restart làm app khởi động lại — chờ thêm chút trước khi poll
          sleep 30

          for i in $(seq 1 15); do
            HTTP_CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            BODY=$(cat /tmp/health.json 2>/dev/null || echo "")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health OK sau lần thử $i: $BODY"
              exit 0
            fi
            echo "[thử $i/15] HTTP $HTTP_CODE — chờ 10s..."
            sleep 10
          done

          echo "::error::App chưa healthy sau deploy ($URL)."
          echo "Kiểm tra: log build trong Dokploy · biến Environment · container emqx/app có chạy không."
          exit 1

      # ---------------------------------------------------------------------------
      # 5. Summary
      # ---------------------------------------------------------------------------
      - name: Tóm tắt
        if: always()
        run: |
          {
            echo "### 🚀 Deploy MQTT Station (full stack)"
            echo ""
            echo "| Mục | Giá trị |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Kết quả | ${{ job.status }} |"
            echo ""
            echo "_Lưu ý: deploy này restart cả EMQX — thiết bị nhúng sẽ tự reconnect trong ~30s._"
            echo ""
            echo "_Log chi tiết: Dokploy UI → service compose → Deployments._"
          } >> "$GITHUB_STEP_SUMMARY"
