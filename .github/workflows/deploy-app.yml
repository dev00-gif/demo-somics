name: Deploy App — MQTT Station (Dokploy)

# Trigger khi push code ứng dụng lên main (EMQX có workflow riêng: deploy-emqx.yml)
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "Dockerfile"
      - ".dockerignore"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch: {}

# Chạy tuần tự các lần deploy — tránh 2 request deploy chồng nhau khi push liên tiếp
concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Dokploy redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (lấy SHA để ghi summary)
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------------
      # 1. Kiểm tra secrets đã cấu hình chưa — fail sớm với thông báo rõ ràng
      #    thay vì lỗi 401 khó hiểu từ API.
      # ---------------------------------------------------------------------------
      - name: Validate secrets
        # GitHub Actions không cho index động secrets[s] → map qua env rồi
        # dùng indirect expansion ${!s} của bash để kiểm tra từng secret.
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          missing=0
          for s in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_APP_ID; do
            if [ -z "${!s}" ]; then
              echo "::error::Secret '$s' chưa được cấu hình."
              echo "        Vào GitHub → Settings → Secrets and variables → Actions → New repository secret"
              missing=1
            fi
          done
          exit $missing

      # ---------------------------------------------------------------------------
      # 2. Trigger deploy qua Dokploy API
      #    POST /api/application.deploy với body {"applicationId": "..."}
      #    (khác với compose service dùng /api/compose.deploy + composeId)
      # ---------------------------------------------------------------------------
      - name: Gọi Dokploy API — application.deploy
        id: deploy
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl -sS -o /tmp/dokploy_response.json -w "%{http_code}" \
            --max-time 30 \
            -X POST \
            "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ secrets.DOKPLOY_APP_ID }}\"}")

          echo "HTTP $HTTP_CODE"
          echo "Response: $(cat /tmp/dokploy_response.json)"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Dokploy từ chối yêu cầu deploy (HTTP $HTTP_CODE)."
            echo "Gợi ý: kiểm tra DOKPLOY_URL (không có / cuối), DOKPLOY_API_KEY còn hạn,"
            echo "và DOKPLOY_APP_ID đúng là id của Application (không phải composeId)."
            exit 1
          fi

      # ---------------------------------------------------------------------------
      # 3. Poll trạng thái deployment trên Dokploy (best-effort)
      #    API là async — trigger thành công ≠ deploy xong. Thử đọc trạng thái
      #    qua /api/application.readStatus; nếu endpoint không có/không phản hồi
      #    thì vẫn pass (không chặn pipeline) vì đã có health check bên dưới.
      # ---------------------------------------------------------------------------
      - name: Chờ deployment hoàn tất (best-effort polling)
        run: |
          set -uo pipefail

          MAX_ATTEMPTS=30        # 30 lần x 20s = tối đa 10 phút
          INTERVAL=20

          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -sS --max-time 15 \
              "${{ secrets.DOKPLOY_URL }}/api/application.readStatus" \
              -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"applicationId\": \"${{ secrets.DOKPLOY_APP_ID }}\"}" \
              2>/dev/null || echo "")

            echo "[attempt $i/$MAX_ATTEMPTS] status: ${STATUS:-<không đọc được>}"

            # API trả chuỗi trạng thái; coi "error" là thất bại, "done" là xong.
            case "$STATUS" in
              *error*)
                echo "::error::Deployment trên Dokploy báo lỗi — xem log trong Dokploy UI."
                exit 1
                ;;
              *done*)
                echo "Deployment hoàn tất sau $((i * INTERVAL))s."
                exit 0
                ;;
            esac

            sleep $INTERVAL
          done

          echo "::warning::Hết thời gian chờ polling ($((MAX_ATTEMPTS * INTERVAL))s) mà chưa đọc được trạng thái."
          echo "Deploy có thể vẫn đang chạy trên VPS — kiểm tra Dokploy UI → Deployments."
          # Không fail job ở đây: build lâu là bình thường, health check phía sau sẽ quyết định.

      # ---------------------------------------------------------------------------
      # 4. Health check domain công khai (nếu đã gắn domain HTTPS trên Dokploy).
      #    Đặt secret HEALTH_CHECK_URL (vd https://mqtt-station.yourdomain.com/api/health).
      #    Nếu chưa đặt secret → bước này tự bỏ qua, không fail.
      # ---------------------------------------------------------------------------
      - name: Health check app sau deploy
        if: ${{ secrets.HEALTH_CHECK_URL != '' }}
        run: |
          set -euo pipefail
          URL="${{ secrets.HEALTH_CHECK_URL }}"

          echo "Polling $URL ..."
          for i in $(seq 1 15); do
            HTTP_CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            BODY=$(cat /tmp/health.json 2>/dev/null || echo "")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health OK sau lần thử $i: $BODY"
              exit 0
            fi
            echo "[thử $i/15] HTTP $HTTP_CODE — chờ 10s..."
            sleep 10
          done

          echo "::error::App chưa healthy sau deploy ($URL)."
          echo "Kiểm tra: log build trong Dokploy, biến môi trường MQTT_*, và container có chạy không."
          exit 1

      # ---------------------------------------------------------------------------
      # 5. Summary
      # ---------------------------------------------------------------------------
      - name: Tóm tắt
        if: always()
        run: |
          {
            echo "### 🚀 Deploy MQTT Station"
            echo ""
            echo "| Mục | Giá trị |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Kết quả | ${{ job.status }} |"
            echo ""
            echo "_Log chi tiết quá trình build chạy trên VPS: Dokploy UI → mqtt-station → Deployments._"
          } >> "$GITHUB_STEP_SUMMARY"
